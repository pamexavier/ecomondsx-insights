name: Nowcast RS (Alertas)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar-tempo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: python -m pip install --quiet requests

      - name: Executar verificação a montante
        env:
          INMET_TOKEN: ${{ secrets.INMET_TOKEN }}
        run: python nowcast_rs.py --uma-vez

      - name: Salvar estado de cooldown se houve disparo
        run: |
          if [ -n "$(git status --porcelain nowcast_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add nowcast_state.json
            git commit -m "chore(nowcast): atualiza estado de alertas [skip ci]"
            git push
          fi